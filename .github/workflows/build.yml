name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Fester Signier-Schlüssel, damit In-App-Updates ohne Deinstallieren funktionieren
      # (siehe README). Ohne das Secret wird ein zufälliger Debug-Schlüssel verwendet;
      # Releases werden dann abgelehnt.
      - name: Debug-Keystore aus Secret wiederherstellen
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Release nur mit festem Schlüssel
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 fehlt. Ohne festen Schlüssel funktionieren In-App-Updates nicht."
            exit 1
          fi

      - name: Tests und Debug-APK bauen
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: APK umbenennen
        run: |
          NAME="DealCheck-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DealCheck-debug-apk
          path: ${{ env.APK_NAME }}

      - name: GitHub-Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
